sinks:
  log:
    level: info
    path: events.jsonl
  telegram:
    enabled: false
    # 仅在本地 Profile 中填写，并保持本文件权限 0600；无需单独的 env。
    # token 和 chat ID 均须加引号，不能提交到 Git 或粘贴进对话。
    bot_token: ""
    chat_id: ""
  dashboard:
    enabled: true
    host: 127.0.0.1
    port: 0  # 由系统分配空闲端口；填写 1–65535 可固定端口。
events:
  telegram: [grounding_question, grounding_answered, new_best_result, leader_started, debate_started, expert_round_done, provider_waiting, provider_retry_requested, provider_recovered, literature_waiting, literature_retry_requested, literature_recovered, error, run_finished, run_briefing]
