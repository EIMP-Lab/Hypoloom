[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hypoloom"
version = "0.0.1"
description = "Autonomous research through hypotheses, experiments, and evidence"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "filelock>=3.0",
    "wsproto>=1.2,<2",
    "jsonschema>=4.26,<5",
]

[project.scripts]
hypoloom = "hypoloom.cli:main"
hypoloom-mcp = "hypoloom.mcp_server:main"

[project.optional-dependencies]
institutional = [
    "playwright>=1.51,<2",
]
notify = [
    # Transports use the standard library; only briefing charts need matplotlib.
    "matplotlib>=3.9,<4",
]
monitor = [
    "textual>=0.50",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
    "build>=1.2",
    "textual>=0.50",
    "websockets>=15,<17",
]

[project.urls]
Repository = "https://github.com/Gray-OREO/Hypoloom"
Issues = "https://github.com/Gray-OREO/Hypoloom/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The console-script entry point otherwise starts with ``.venv/bin`` on
# sys.path; a full suite happened to import the repository root indirectly,
# while an isolated maintenance-script test could not.  Make collection order
# irrelevant and keep local source/scripts explicit.
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["hypoloom*"]
exclude = ["tests*", "profiles*", "scripts*"]

[tool.setuptools.package-data]
"hypoloom" = [
    "migrations/*.sql",
    "skills/*/SKILL.md",
    "skills/research-workflow/references/*.md",
    "skills/expert-seed/.claude-plugin/plugin.json",
    "skills/expert-seed/skills/*/SKILL.md",
    "skills/grounding-seed/.claude-plugin/plugin.json",
    "skills/grounding-seed/skills/*/SKILL.md",
    "web_observer_assets/*",
    "connection_assets/*.ps1",
]
